name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Run full evaluation
        run: python scripts/run_evaluation.py

      - name: Run security evaluation
        run: python scripts/run_security_evaluation.py

      - name: Run AI-assisted testing workflow
        run: python scripts/run_ai_testing_workflow.py

      - name: Run challenge evaluation
        run: python scripts/run_challenge_evaluation.py

      - name: Run regression gates
        run: python scripts/run_regression_checks.py
